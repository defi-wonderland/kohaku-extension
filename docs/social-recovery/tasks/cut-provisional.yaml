    body: |
      Write `src/ux/management/editor/`, the management editor and the review of changes of D-309. The overview has no separate methods list, and every member and method change happens inside the path editor of PT-044 and ends in a review of changes before one owner-signed transaction. Editing loads the path into the editor, asking the recovery password where this device cannot read it, and states which committed values change. It states that a changed password or privacy level makes a printed card stale and offers changing the recovery password as one of those values, the exit the done screen of PT-062 points at. The editor blocks removing a member the path still needs in place, the member marked still needed under D-302, with the fix, lower the threshold or add a replacement first. The management editor and the overview's readout carry the rule lines of PT-037, since a holder reads a shape's consequences where they change that shape.

      Saving while an attempt is pending carries the line saving will cancel the recovery in progress above the primary action, I-30. Removing recovery always warns that the account will have no recovery path, asks the holder to type to confirm, and while an attempt is pending adds that removing recovery cancels the recovery in progress. The review of changes carries, for every row the edit adds, the trust list rows of PT-049, the publication line and the security stop block, D-317. The save runs the prepare update of D-371, which takes the next path and reads the current setup from the chain itself and never from a client copy, an edit during a wait cancelling the running attempt as the same act. Removal runs the prepare remove, which clears the setup and zeroes the action's authorization in the privilege table in one batch since Kohaku's account can revoke it, contracts D-102, so neither write alone leaves a dormant setup or a dead authorization. Both writes run through the shared states and the gas check of PT-039 from the account's controlling key.

      The test seat drives an edit, a password change, a blocked removal, a save and a removal each with and without a pending attempt, and asserts the lines, the confirm typing, the review's rows and the batches prepared. The implementation seat writes the editor's management shell and the review of changes over the editor of PT-044.
