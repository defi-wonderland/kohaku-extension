tasks:
  - provisional_id: PT-001
    title: The kit's interfaces and shared types
    size: half-day
    module: interfaces
    risk: low
    risk_reason: Declarations only, with no logic to get wrong, and every other task compiles against them.
    milestone: M-1
    depends_on: []
    interfaces:
      - IPolicyAction
      - IPolicyManager
      - IPolicyMethod
      - IPolicyMethodAdmin
      - IPolicyMethodPause
      - IRecoveryAction
    owns_interfaces:
      - IPolicyAction
      - IPolicyManager
      - IPolicyMethod
      - IPolicyMethodAdmin
      - IPolicyMethodPause
      - IRecoveryAction
    invariants: []
    design_refs:
      - D-101
      - D-103
      - D-104
      - D-105
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - judgment: every function, struct, enum, error and event the six interface blocks of D-103, D-104 and D-105 declare appears once, with the NatSpec the chapter gives it
      - judgment: nothing outside those blocks is declared, and the two constants, the verify magic value and ERC-1271's, equal the values D-104 fixes
    body: |
      Write the six interfaces every other task compiles against, with their structs, enums, errors and events, exactly as the interface subsections of D-103, D-104 and D-105 declare them. The files are `src/interfaces/IPolicyManager.sol` with `Setup`, `Attempt`, `ActionState`, `AttemptRequest`, `CancelRequest`, `ProofPlace`, `PaymentOrder`, `AttemptState` and the manager's errors and events, `src/interfaces/IPolicyMethod.sol`, `src/interfaces/IPolicyMethodPause.sol`, `src/interfaces/IPolicyMethodAdmin.sol`, `src/interfaces/IPolicyAction.sol` and `src/interfaces/IRecoveryAction.sol` with `Handover`, `Transaction` and the action's errors.

      Two constants belong here because two contracts must agree on them. The method's magic value is the selector of `verify(bytes,bytes32,bytes)`, which ERC-7913 fixes as `0x024ad318`, and the wallet method's inner ERC-1271 check reads that standard's own magic value. Widths are the chapter's: timestamps are `uint48`, ids and nonces are `uint64`, and `place` is `uint256`.

      This task decides nothing. Where the chapter's prose and its Solidity block disagree, the Solidity block of the section is what this task writes, and the disagreement is reported rather than resolved. The test seat compiles the interfaces and asserts each selector and each ERC-165 interface id the other tasks will return.
  - provisional_id: PT-002
    title: The setup body codec
    size: half-day
    module: libraries/setup-body
    risk: medium
    risk_reason: A pure library, but its refusals decide which rules can ever open an attempt, and its bytes are one of the formats the vectors freeze.
    milestone: M-1
    depends_on:
      - PT-001
    interfaces:
      - IPolicyManager
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-103
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: standard
      - judgment: the body with no clauses and the rule whose every threshold is zero both fail as RuleUnsatisfied naming clause zero
      - judgment: a zero clause beside a positive one is representable and the rule turns on the positive clause alone
      - judgment: credentialAt reverts with PlaceOutOfRange exactly at the first index past the last clause
    body: |
      Write `src/libraries/setup-body/SetupBody.sol`, the library that reads the committed setup body the way the setup body subsection of D-103 fixes it. The body is `abi.encode` of `(uint48 wait, bool ignoresPause, Clause[] clauses)`, and a clause is `(uint8 threshold, bytes32[] credentials)`.

      The library exposes the four readers the chapter names. `credentialAt(body, place)` returns the credential hash at a flat place across all clauses in body order and reverts with `PlaceOutOfRange` past the end. `ruleSatisfied(body, filledPlaces)` counts filled places per clause against its threshold and returns whether every clause meets its own, naming the first failing clause, false with clause zero for a body with no clauses and for a rule whose every threshold is zero, and, for a zero clause beside a positive one, counts the zero clause as met by nothing filled so the rule turns on the other clauses alone. `ignoresPauseOf(body)` and `waitOf(body)` read the two scalars.

      The library never trusts a position in the proofs array as filled. The caller hands it the places that verified, and it counts those. It holds no storage and no numeric limit beyond the widths.

      The test seat covers the boundaries: an empty body, one clause, a clause whose threshold exceeds its count, a place at the last index and one past it, and a repeated credential at two places counting twice. The encoding is one of the formats the manager and the SDK must agree on, so the vector replay task consumes this library's encoder.
  - provisional_id: PT-003
    title: The binding digest and the commitments
    size: half-day
    module: libraries/binding-digest
    risk: high
    risk_reason: Every proof a helper signs is a hash this library computes, and a digest computed one byte differently verifies nowhere.
    milestone: M-1
    depends_on:
      - PT-001
    interfaces:
      - IPolicyManager
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-103
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: the Approval and Cancellation type strings, the nested PaymentOrder type and the domain fields match the digest subsection of D-103 character for character
      - judgment: an approval digest and a cancellation digest over the same members differ, and two requests differing in any one member produce different digests
      - judgment: every preimage is abi.encode over the list D-103 states and never encodePacked
    body: |
      Write `src/libraries/binding-digest/BindingDigest.sol`, the EIP-712 encoder for what a helper's proof approves, and the three preimages beside it. The digest subsection of D-103 fixes the two message types, `Approval` with its nested `PaymentOrder` and `Cancellation`, the domain with the name `PolicyManager`, the constant `DIGEST_VERSION`, the chain id and the manager's address, and the one pre-hashed member `setupBodyHash`, the keccak of the setup body's own bytes.

      The library exposes `approvalDigest(domainSeparator, request, place)` and `cancelDigest(domainSeparator, request, place)`, each taking the members from the request struct so the view and the verification path call one encoder. Beside them it exposes the setup commitment preimage `keccak256(abi.encode(account, action, nonce, body))`, the credential commitment `keccak256(abi.encode(method, config, salt))` and the default salt `keccak256(abi.encode(account, place))`, all `abi.encode` and never `encodePacked`.

      The type name is part of what a proof signs, so an approval never counts as a cancellation. The payload travels as `bytes` and the order as a nested struct, hashed the way EIP-712 hashes dynamic and nested members.

      The test seat asserts each type hash against the chapter's strings, the domain against ERC-5267's field order, and that two requests differing in any one member produce different digests. This library's outputs are what the manager's `hashApproval` and `hashCancel` views return, and the vector replay task replays them.

      The library exposes no default salt derivation. The salt is the SDK's, and the manager only recomputes the credential commitment over the salt a request supplies, as D-110 says.
  - provisional_id: PT-004
    title: The policy manager's storage and configuration doors
    size: half-day
    module: policy-manager
    risk: medium
    risk_reason: The account-only doors decide who may write a setup, and the nonce rule retires every proof.
    milestone: M-1
    depends_on:
      - PT-003
    interfaces:
      - IPolicyManager
    owns_interfaces: []
    invariants:
      - I-2
      - I-7
    design_refs:
      - D-103
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: standard
      - judgment: a setup write from any address other than the account itself reverts
      - judgment: every setup write moves the nonce by exactly one and never rewinds it, cancels a waiting attempt before the nonce moves with its own event, and writes setupCommittedAtBlock, a clear zeroing the commitment
      - judgment: hashApproval and hashCancel return the values the binding digest library computes for the same request and place
      - judgment: the holder's own cancel reaches no method and no pause read, which is I-7's whole claim
    body: |
      Write `src/policy-manager/PolicyManager.sol` with its storage and the three account-only doors, leaving the attempt calls and the spend as reverting stubs for the two tasks that follow in this module. The storage is the two mappings of D-103, `setups` and `attempts`, keyed by account then action, with the `Setup` struct's commitment, nonce, attempt counter and committed block.

      `commitSetup` refuses a nonce other than the current one plus one as `WrongSetupNonce`, refuses `bytes32(0)` and the commitment of zero-length bytes as `InvalidCommitment`, cancels any waiting attempt before the nonce moves with its own `AttemptCancelled` carrying a zero canceller, then writes the commitment, the nonce and the block and emits `SetupCommitted` with both metadata fields. `clearSetup` reverts with `NoSetup` where none exists, cancels the same way, moves the nonce and emits `SetupCleared`. `cancelByOwner` cancels whatever attempt is live and reverts with `NoActiveAttempt` otherwise. The caller is the account for all three, and no argument names one.

      `clearSetup` also zeroes the commitment, the no-setup value, and every setup write, a clear included, writes `setupCommittedAtBlock` with the current block number. `stateOf` returns the `ActionState` of D-103 in one read. The attempt counter never moves here. The two digest views `hashApproval(request, place)` and `hashCancel(request, place)` land here too, each calling the binding digest library's one encoder so the view and the later verification path cannot disagree, together with `eip712Domain`, `supportsInterface`, `name` and `version`, the domain read from that library. I-7, the holder's own cancel that no method and no pause can reach, is decided by `cancelByOwner` here and owned here, and I-16's first clause, that the commitment is the only setup configuration in storage, is decided by these writes and owned by the acceptance path task that depends on this one, which the cut states so no gate is surprised.

      The test seat proves I-2 with a fuzz over writers and nonces, and asserts one event per write and the cancel event preceding the nonce move.
  - provisional_id: PT-005
    title: The policy manager's acceptance path
    size: half-day
    module: policy-manager
    risk: high
    risk_reason: This is where a proof set becomes an attempt, and every replay, ordering and verdict check of the chapter runs here.
    milestone: M-1
    depends_on:
      - PT-002
      - PT-004
    interfaces:
      - IPolicyManager
      - IPolicyMethod
      - IPolicyMethodPause
    owns_interfaces: []
    invariants:
      - I-3
      - I-4
      - I-5
      - I-8
      - I-9
      - I-11
      - I-12
      - I-13
      - I-14
      - I-16
    design_refs:
      - D-103
      - D-104
      - D-111
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: the five pre-checks run in the order D-103 states and each failing one reverts with its named error before any place is read
      - judgment: a method that reverts, returns nothing, returns more than one word or returns any word but the magic value reads as a rejected proof, and the returned size is read before any copy
      - judgment: a stopped method's proof is refused as MethodStopped before its verify is called, and never where the body ignores stops
      - judgment: a cancellation runs the same block with exactly the four differences D-103 names
    body: |
      Fill in `startAttempt` and `cancelByProofs` in `src/policy-manager/PolicyManager.sol`, the verification order at acceptance of D-103 and the four moments of D-111 where the manager reads a stop.

      An opening checks five things before it reads any place, in the chapter's order: a setup exists, no attempt waits, the request names the stored nonce, the attempt id is the counter plus one, the window has not passed. It then recomputes the setup commitment over the request's body and refuses a mismatch. For each proof, places strictly increasing, it recommits method, config and salt against `credentialAt`, reads the method's `paused()` once per distinct method unless the body ignores stops and refuses `MethodStopped`, computes the place's digest through the binding digest library, and dispatches `verify` as a static call whose answer counts only on success with exactly one returned word equal to the magic value left-aligned, reading the returned size before copying anything back and copying that one word alone, the order D-111 fixes for both outside reads. Then `ruleSatisfied` decides, and the attempt record of D-103 is written with `consumableAfter` computed in `uint48` under checked arithmetic, the payload hash, the order, the distinct methods in proof order and the pause choice copied from the body. `AttemptStarted` carries the cleartext body and payload.

      A cancellation runs the same block with the differences the chapter names: the attempt must be waiting and named by id, the cancel digest is used, the attempt's nonce is checked against the setup's, and no setup existence check runs. Every error carries its offending values.

      Three invariants straddle this task and its neighbours by decision: I-8's cancel-by-veto third and I-19's opening refusal are decided in the spend and veto task, and I-16's storage clause in the doors task, each owned where the cut lists it and stated here so the harness reaches across the lane on purpose. The test seat owns the fuzz for the ten invariants this task lists, with hostile methods that revert, echo, return long words or write state, and it asserts the one-word read before any copy.
  - provisional_id: PT-006
    title: The policy manager's spend and veto
    size: half-day
    module: policy-manager
    risk: high
    risk_reason: The consume is the whole release path, and a second release or an early one loses the account.
    milestone: M-1
    depends_on:
      - PT-005
    interfaces:
      - IPolicyManager
      - IPolicyMethodPause
    owns_interfaces: []
    invariants:
      - I-1
      - I-6
      - I-10
      - I-19
      - I-20
    design_refs:
      - D-103
      - D-104
      - D-111
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: consume runs every local check against its own storage before its first outside call, and refuses on the first used method answering exactly true
      - judgment: cancelByVeto reads no proof, refuses each of the six conditions D-103 names by its error, and moves neither the nonce nor the counter
      - judgment: the manager's state rebuilt from its events alone equals its storage after every fuzz sequence, which is I-20
      - judgment: at most one attempt waits per account and action at any point of every fuzz sequence, and no consumed or cancelled attempt transitions again
    body: |
      Fill in `consume` and `cancelByVeto` in `src/policy-manager/PolicyManager.sol`, with the pause read `_vetoes` both share, completing the manager.

      `consume` takes the account as its caller. It refuses with `NoActiveAttempt` where nothing waits, `WrongAttemptId` on any id but the live one, `StaleAttempt` where the setup nonce moved, `WaitNotOver` before `consumableAfter`, and `WrongPayload` on any hash but the committed one, all against its own storage before any outside call. Then, unless the attempt ignores stops, it asks each used method whether it vetoes and refuses `MethodVetoedSpend` on the first exact true. It flips the state to consumed and emits `AttemptConsumed`, so a second call reverts.

      `cancelByVeto` is permissionless and reads no proof. It refuses with no waiting attempt, a wrong id, a moved nonce, an attempt that ignores stops as `AttemptIgnoresPause`, a method the attempt did not use as `MethodNotUsed`, and a method that does not answer exactly true as `MethodNotStopped`. It moves neither the nonce nor the counter and emits `AttemptCancelled` with the vetoing method and empty places.

      `_vetoes` makes a static call to `paused()`, reads the returned size before copying, and answers true only on success with exactly one word equal to the encoding of true.

      The test seat owns the fuzz for the six invariants listed, driving every path of the state machine of D-103 against a model, and it proves I-20 by rebuilding the manager's state from its events alone.
  - provisional_id: PT-007
    title: The wallet method
    size: half-day
    module: method-ecdsa
    risk: medium
    risk_reason: Two verification paths, and the contract path reads another account's answer.
    milestone: M-1
    depends_on:
      - PT-001
    interfaces:
      - IPolicyMethod
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-104
    dependencies:
      - "@openzeppelin/contracts"
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: standard
      - judgment: a signature over any message other than the EIP-712 digest, a personal-message signature among them, is refused
      - judgment: a contract guardian's answer counts only as ERC-1271's exact magic value on a successful call, and the key path is tried first
      - judgment: trustedParties answers the zero address twice and an empty list
    body: |
      Write `src/method-ecdsa/EcdsaMethod.sol`, the wallet method of D-104. Its config is the guardian's address and its proof is a signature over the place's digest.

      `verify` tries the key first, `ecrecover` over the digest through the registered `ECDSA` library, which refuses a high signature half and a bad recovery byte, and passes when the recovered signer equals the config and the config is not zero. It then tries the contract path, a static call to `isValidSignature(digest, proof)` on the config address whose answer counts only on success with exactly ERC-1271's magic value, the dispatch the registered `SignatureChecker` performs. Either path passing returns the magic value, and anything else returns a word that is not the magic value. The method never looks at whether the address has code.

      The method accepts the digest and no other signed form. `trustedParties` answers the zero address for both roles and an empty key list. `supportsInterface` answers for `IPolicyMethod` and ERC-165, and `name` and `version` are constants. The method holds no storage.

      The test seat covers an ordinary key, a contract guardian answering the magic value, one answering anything else, one reverting, the zero config, and a signature over a personal message of the same digest, which must fail. The proof and config layout are among the formats the method vector replay task replays.

      The contract path is commodity machinery: the method calls OpenZeppelin's registered `SignatureChecker.isValidSignatureNow`, the same ERC-1271 dispatch Safe's `checkNSignatures` runs for a contract owner, rather than rewriting it. The contract path takes the library's rule as D-104 states it: an address with no code takes the ECDSA path, an address with code takes the ERC-1271 path with the magic value in the first return word, and neither falls back to the other.
  - provisional_id: PT-008
    title: The passkey method
    size: half-day
    module: method-passkey
    risk: high
    risk_reason: The method parses an assertion two devices produced and compares text, and a parsing mistake either refuses every honest helper or admits a forged one.
    milestone: M-1
    depends_on:
      - PT-001
    interfaces:
      - IPolicyMethod
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-104
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: the check list of D-104 is implemented field by field, challenge as base64url without padding, assertion type, relying party hash, user-verified flag, signature under the committed key
      - judgment: the precompile's answer is read as a value on a successful one-word return and never as mere success
      - judgment: a client data document with an extra field verifies, and one with a different challenge, type or relying party hash does not
    body: |
      Write `src/method-passkey/PasskeyMethod.sol`, the passkey method of D-104. Its config is the helper's P-256 public key as x and y with the hash of the relying-party id, and its proof is the assertion, the authenticator data, the client data JSON and the signature's r and s.

      `verify` rebuilds what the authenticator signed, the hash over the authenticator data and the client data hash, and checks the list the chapter fixes: the client data's challenge is the place's digest in WebAuthn's base64url rendering without padding, the client data's type is the one an assertion carries, the relying party hash in the authenticator data equals the committed one, the user-verified flag is set, and the signature verifies under the committed key through the P256VERIFY precompile. The precompile's answer counts as a value on a successful return of exactly one word, never as mere success. The method accepts either signature half, since the SDK normalizes and the precompile does not care.

      `trustedParties` answers nobody and nothing, `supportsInterface`, `name` and `version` as for the wallet method. The method holds no storage and commits no origin, the decision D-104 records.

      The test seat drives the parser with assertions that move each field, the challenge at different offsets inside the client data, an extra JSON field, a missing user-verified flag, and a signature under another key. The check list this task implements is what the method vector replay task freezes, so the seat writes its fixtures in the shape a vector file will carry.
  - provisional_id: PT-009
    title: The roles a method carries
    size: half-day
    module: method-roles
    risk: medium
    risk_reason: The two roles are the only state in the kit anyone can move after deployment, and one of them can forge a method's proofs.
    milestone: M-2
    depends_on:
      - PT-001
    interfaces:
      - IPolicyMethod
      - IPolicyMethodAdmin
      - IPolicyMethodPause
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-104
      - D-106
      - D-111
    dependencies:
      - "@openzeppelin/contracts"
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: standard
      - judgment: the pause holder can stop and lift and do nothing else, and renouncing ownership while paused leaves the method stopped for good
      - judgment: the key admin can set keys, transfer in two steps and renounce and do nothing else, and renouncing either role leaves the other standing
      - judgment: trustedParties reports both roles, both pending holders and the keys, and the base answers supportsInterface, name and version for the inheriting method
    body: |
      Write `src/method-roles/PolicyMethodRoles.sol`, the abstract contract the two identity methods inherit, carrying the stop of D-111 and the key admin of D-104.

      The stop is OpenZeppelin's `Pausable` with `Ownable2Step`, the owner being the pause holder. The contract declares `pause` and `unpause`, restricted to the owner, calling the library's internal helpers and doing nothing else, and `paused()` is the read the manager makes. The key admin is a role of its own with `setTrustedKeys`, `transferAdmin`, `acceptAdmin`, `pendingAdmin` and `renounceAdmin`, emitting `TrustedKeysUpdated`, `AdminTransferOffered`, `AdminTransferred` and `AdminRenounced`. `trustedParties` assembles the admin, the pending admin, the trusted keys, the owner and the pending owner. The base also carries the three members every method answers and the two identity methods would otherwise each declare, `supportsInterface` for `IPolicyMethod`, `IPolicyMethodPause`, `IPolicyMethodAdmin` and ERC-165, and `name` and `version` as constructor-set strings.

      Each renounce gives up its own role and leaves the other standing. Renouncing ownership while paused leaves the method stopped for good, the end state D-111 names. The constructor takes the initial owner, the initial admin and the initial keys.

      The library surface this task needs, `Pausable` and `Ownable2Step`, is in the registered surface of `@openzeppelin/contracts` 5.6.1, together with `ERC165`. The test seat proves the role separation with a fuzz over callers and orders of calls.
  - provisional_id: PT-010
    title: The zkPassport method
