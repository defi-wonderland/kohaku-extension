      The implementation seat has no code to write, since the kit's encoders exist and the vectors are the owner's. The operator dispatches this task with `--accept-empty-role impl --reason "the replay tests consume encoders earlier tasks wrote and vector files the owner blessed, so no implementation work exists"`. The test seat writes every test under `test/kat/` and nowhere else, and it never regenerates a vector.

