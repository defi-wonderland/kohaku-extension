        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - judgment: the extension builds one client from a configuration naming one chain, the address book of the manager, the methods and the action, and a provider adapter whose four reads route through the extension's own provider, and it hands the client no signer and no storage
      - judgment: the signer facade signs typed data or raw bytes for a key the keystore holds, addressed by address and key type, and exposes no key export
      - judgment: with no rail configured every prepared call is sent from a key the signer holds, and the digest version the manager publishes through its domain is checked when the client is built, a disagreement refusing the client before anything is prepared
      - judgment: the table of the kit's audited actions with their publishers is the extension's own and is the only source of the action a screen offers or names
    body: |
      Write `src/ux/shared/client/`, the layer of D-370 between the extension and the SDK. It builds one recovery kit client from a configuration for the one chain the wallet reads, named as a fixed label with no switch per D-312, with the address book of the deployed manager, methods and action and the deployment descriptor of D-208. The provider adapter implements the SDK's `IProvider` over the extension's own provider, whose `send` may route through a light client and its prover, and the extension's own balance reads and gas estimates run beside it since the SDK's provider answers four reads and no balance, D-373. The SDK stores nothing and holds no signer, so the extension's storage and its signer stay outside the client.

      The signer facade signs typed data or raw bytes for a key the keystore holds, addressed by the keystore's own handle of address and key type, and exposes no key export whatever the keystore's settings surfaces do. In the first release the extension configures no sponsor rail, so every prepared call, a setup write, a submission, an execution or a cancel, is sent from a key the signer holds, the account's controlling key for account operations and the recoverer's own key for the recovery calls. The client is built through the SDK's builder against the doubles of PT-035 until the sdk lands. When the wallet builds the client for an account it checks the digest version the manager publishes through its domain, and a disagreement refuses the client before anything is prepared, the state D-306's account step draws as update the wallet, D-319. The module also holds the extension's own table of the kit's audited actions and their publishers, the one source of the recovery module and its publisher every screen names, and the deployment descriptors of D-208 for the two chains.

      The test seat builds the client over the doubles, asserts the four reads route through the adapter, the refusal on a disagreeing digest version and the send path from a signer-held key, and asserts the facade signs and never exports. The addresses of the address book are the pins cut-q-7 owes and the test seat uses placeholders it names as such.
  - provisional_id: PT-039
