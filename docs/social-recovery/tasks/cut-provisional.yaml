      - judgment: the digest reaches the verifier as the bound data of a custom field in the one text rendering D-104 fixes, and any other rendering fills no place
      - judgment: the verifier's answer is read as a value on a successful one-word return, and its vector rows under I-22 replayed before this gate
    body: |
      Write `src/method-zkpassport/ZkPassportMethod.sol`, inheriting the roles contract. Its config is the identity commitment the zkPassport stack derives for one document under one scope, and its proof is the zero-knowledge proof with its public inputs.

      `verify` checks three things against the pinned verifier, an UltraHonk verifier reached by its address: the proof verifies, the identity commitment among the public inputs equals the config, and the digest enters as the bound data of a custom field as text, the `0x` prefix followed by sixty four lowercase hexadecimal characters. The verifier's answer is read as a value on a successful one-word return. The certificate root the proofs are checked against is the trusted key the admin sets.

      The verifier's address and the root are constructor arguments the deployment task pins. D-104 pins the route per network, the root verifier, the version 0.20 sub-verifier, the helper and the root registry on mainnet and Sepolia, and the six checks `verify` runs. Unit and fuzz suites replace the verifier with a deterministic project-owned mock, and fork smoke tests exercise the published contracts with the RPC endpoints the operator supplies as CI secrets.

      The test seat covers a proof for another document, a digest rendered in uppercase or without the prefix, a verifier that reverts, and a stop and lift around a verification.

      The verifier is zkPassport's, published and deployed by them. This task writes no circuit, no verifier and no deployment of one, and declares only the interface it calls the verifier through, whose function and ABI D-104 fixes.
