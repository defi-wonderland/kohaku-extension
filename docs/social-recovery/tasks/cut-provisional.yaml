  - provisional_id: PT-019
    title: The backup encryption
    size: half-day
    module: sdk/encryption
    risk: high
    risk_reason: A backup a holder cannot open on a fresh device is a rule they cannot rebuild, and a ciphertext whose length varies leaks the rule's size.
    milestone: M-3
    depends_on:
      - PT-071
    interfaces: []
    owns_interfaces: []
    invariants: []
    design_refs:
      - D-204
    dependencies:
      - viem
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: sealBackup and openBackup round trip every configuration under the shipped bound, and every sealed payload has the one fixed length
      - judgment: a wrong password, damaged bytes and a foreign associated-data value all fail under one check, and a plaintext beyond the padding is refused
    body: |
      Write `src/sdk/encryption/`, the two functions of D-204's backup payload subsection: `sealBackup(configuration, password, nonce, paddingSize, authenticated)` and `openBackup(payload, password, authenticated)`. The configuration's serialization lives here, the password-to-key derivation lives here with its parameters pinned, and the five authenticated values, the account, the action, the setup commitment, the setup nonce and the payload version, bind the ciphertext so a backup opened against another setup fails the same way a wrong password does. The cipher runs on WebCrypto and nothing else, so the module names no browser object and no file system.

      The padding is one fixed size the SDK ships and nobody overrides, derived as D-204 states, the credential count this version fixes times the widest shipped config plus a thirty two byte supplied salt, and a plaintext beyond it is refused here and raised as `backup.too-wide` by validation. The nonce is the caller's, so a test replays a sealed payload byte for byte.

      The test seat covers the round trip over a rule of every shipped method, a configuration carrying supplied salts, the fixed length across rules of different widths, the four failure paths under one associated-data check, and the refused width. Its fixtures follow the shape of `backup-payload.json`.

      The scheme is the owner's: PBKDF2-HMAC-SHA256 at 600,000 iterations for the password's key, AES-256-GCM with a 96-bit random nonce, the five authenticated values as associated data, and one fixed padding sized for 16 credentials at the widest shipped config plus a supplied salt and the method address, WebCrypto only. The payload version constant is what changes when the scheme changes.
