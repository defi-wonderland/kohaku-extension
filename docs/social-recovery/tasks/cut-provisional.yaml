      Write the deadline, the polls and the deaths of D-392 in `src/ux/recovery/checklist/`, after PT-058. The request carries one validity window every claim signs, the wallet's own default of 24 hours from the moment the request is created, which is the checklist's opening, and no screen asks the recoverer for it, the owner's ruling of 2026-09-22. The wallet sets the width entry of the client configuration to that value so the SDK's window check never fires under it, D-205. The deadline shows at the first row and as a countdown with the sentence that every approval dies together, dropped where one approval is the whole request, and the first row carries the line that anyone holding the request's bytes can submit it until the window ends. The window cannot change once the first approval is in, contracts D-107, so the expired state says the whole set is gathered again.

