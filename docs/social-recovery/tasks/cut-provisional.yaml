    done:
      - check: build
      - check: fuzz
        budget: standard
      - judgment: supportsAccount answers true only for a minimal proxy whose implementation address is the pinned one, and false for any other bytecode, an EIP-7702 designator among them
      - judgment: KIT_SLOT and the binding value match the derivations D-105 fixes, and no kit slot collides with an address Ambire's slot helper produces
      - judgment: the four readings of the account D-210 records as unconfirmed are each confirmed or refuted in the report with file and line
    body: |
      Write `src/action/AmbireRecoveryAction.sol` with its constants, its constructor and the view half of D-105, leaving `executeHandover` and `validateSig` to the task that follows in this module.

      The action holds the manager's address and the pinned `AmbireAccount` implementation address as immutables. `KIT_SLOT` is `address(uint160(uint256(keccak256(abi.encode("kit", address(this))))))` and the binding value is `keccak256(abi.encode(address(this), bytes("")))`, both derived once. `KEY_VALUE` is 1.

      `supportsAccount` reads the implementation address out of the minimal proxy's bytecode by the proxy's prefix, answers true when it equals the pinned one, and false for any other bytecode, for a code size that fits no such proxy, and for an EIP-7702 delegation designator. `isAuthority` answers true for a privilege value of 1 or 2. `isAuthorized` answers whether the entry under `KIT_SLOT` equals the binding value. `holdsAnyPrivilege` answers whether the entry is nonzero. `supportsInterface`, `name` and `version` complete the views.

      The account's interface this task reads, the `privileges` getter, is Ambire's at commit 29227cc of kohaku-commons, which D-105 treats as design evidence behind a local minimal interface this task declares rather than as an imported dependency. The action task's confirmation duties belong here: compiling the pinned source against the deployed bytecode on mainnet and Sepolia, checking that no kit slot collides with Ambire's own slot helper, and confirming against that revision the four readings D-210 records as unconfirmed, that a call failing inside the batch reverts `execute` with that call's own revert data, that the wallet refuses to sign ordinary typed data with a key at value 1, that the privilege event is `LogPrivilegeChanged(address indexed addr, bytes32 priv)`, and that the creation code writes one privileged address the `create2` derivation reproduces. Each confirmation is a sentence in the task's report with the file and line it was read at.

      The test seat drives the fit check with crafted bytecode and a fork of both deployed implementations where one is reachable.
  - provisional_id: PT-013
    title: The recovery action's spend
    size: half-day
    module: action
    risk: high
    risk_reason: The callback is the whole check on the account's authority, and a batch it wrongly approves runs with that authority.
    milestone: M-1
    depends_on:
      - PT-006
      - PT-012
    interfaces:
      - IPolicyManager
      - IRecoveryAction
    owns_interfaces: []
    invariants:
      - I-17
      - I-18
    design_refs:
      - D-103
      - D-105
      - D-110
    dependencies:
      - forge-std
    outputs: []
    agents:
      impl:
        model: claude-opus-5
        effort: xhigh
      test:
        model: claude-sonnet-5
        effort: high
    done:
      - check: build
      - check: fuzz
        budget: deep
      - judgment: validateSig requires the exact call count before reading any call and approves exactly the batch the attempt fixes, three calls or four, each compared byte for byte after the handover is rebuilt from the grant and the revoke
      - judgment: every other batch reverts with the named error D-105 gives it, BatchNotApproved naming the call index
      - judgment: the consume lands with the writes or not at all, and a second run of the same batch reverts whole
    body: |
      Fill in `executeHandover` and `validateSig` in `src/action/AmbireRecoveryAction.sol`, the spend of D-105 on Ambire's account.

      `executeHandover` reads the manager's `stateOf` for the account and this action as an early exit, refusing `NotConsumable` unless the attempt waits, is at or past its wait and committed to this payload's hash. It decodes the payload as `Handover`, applies `MalformedHandover` for a zero on either side or the same address on both, builds the batch of `Transaction` structs, `consume` at the manager with this action, the attempt id and the payload hash, then `setAddrPrivilege(newKey, 1)`, then `setAddrPrivilege(removedKey, 0)`, then the payment where the order carries an amount, and hands it to the account's `execute` with the signature `abi.encode(KIT_SLOT, address(this), bytes(""), bytes(""))` followed by the byte 255. An open order encodes the caller as payee.

      `validateSig` takes the account to be its caller, reads the attempt through `stateOf`, requires it waiting and at or past its wait, requires the exact call count before reading any call, requires the first call to equal the consume it would have built, decodes the two addresses out of the grant and the revoke, rebuilds the `Handover` and requires its hash to equal the attempt's, applies the payload refusals, rebuilds both writes whole and requires each to equal the batch's byte for byte, refuses with `ReservedAuthority` a new key that already holds any privilege, refuses with `ReservedAuthority` a removed entry that does not hold a key value, requires the fourth call to equal the payment call for the order where present, and answers `(true, 0)`. Every other batch reverts with `BatchNotApproved` naming the call index.

      The payment is a raw call, a transfer of the order's token to the payee or a value call for the native asset, never wrapped, the decision D-110 records.

      The fixture of Ambire's account the test seat drives is built on local minimal interfaces over the pinned revision, which D-105 treats as design evidence rather than an imported dependency. The test seat owns the fuzz for I-17 and I-18 against a fixture of the pinned account, driving batches that reorder, add, drop or alter calls and payments, and proving that the consume lands with the writes or not at all.
