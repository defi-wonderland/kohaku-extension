      - judgment: a proof under any issuer key but the trusted one fills no place, and the constructor refuses the stack's published test key
      - judgment: its vector rows under I-22 replayed before this gate
    body: |
      Write `src/method-aadhaar/AadhaarMethod.sol`, inheriting the roles contract. Its config is the identity commitment the Anon Aadhaar stack derives, and its proof is the Groth16 proof with its public inputs.

      `verify` checks the proof against the pinned Groth16 verifier reached by its address, requires the identity commitment among the public inputs to equal the config, requires the issuer public key hash among them to equal the trusted key, and requires the signal to be the stack's reduction of the digest, the keccak of the digest zero-padded to thirty two bytes and shifted right by three bits. The verifier's answer is read as a value on a successful one-word return.

      The constructor takes the verifier address, the initial roles and the trusted issuer key hash, and it refuses the stack's published test key by value, since that key accepts forged proofs. D-104 pins the verifier address and the Sepolia route, and the tests follow the same rule as the zkPassport method: a project-owned mock in unit and fuzz suites and a fork smoke test on Sepolia.

      The test seat covers a proof under another issuer key, a wrong signal reduction, a verifier that reverts, the refused test key, and a stop and lift around a verification.

      The Groth16 verifier and its wrapper are Anon Aadhaar's own, shipped in `@anon-aadhaar/contracts` and reached by address. This task writes no circuit and deploys no verifier; what it decides is the refused test key and the signal reduction. D-104 fixes the call shape.
  - provisional_id: PT-012
    title: The recovery action's fit check and views
    size: half-day
    module: action
    risk: medium
    risk_reason: The fit check reads bytecode by offset and the slot derivation is a format two stacks must agree on.
    milestone: M-1
    depends_on:
      - PT-001
    interfaces:
