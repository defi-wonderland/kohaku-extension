      Write the signing half of the approval page of D-308 in `src/ux/guardian-page/`, after PT-063. Three axioms gate the sign button together. It stays disabled until the account being recovered, the new key, the key being removed and the payment, or the words no payment, have rendered, I-27, until the request's deadline has rendered beside them, I-40, and until the guardian ticks the acknowledgment, I called the owner on a number I already had and they confirmed this, or I am the owner, I-39, since a holder may be their own guardian. The guardian places the call and never the link's sender. The tick is a pause rather than an enforcement, and beside it the page says that a call the guardian received does not answer it, whatever the caller named themselves. The page compares the connected wallet's address with the credential the row fills and disables sign on a mismatch with the reason that the connected wallet is not the address this row names, asking the guardian to connect that address, since the comparison knows only that the two differ, D-374. The page carries the call instruction and the acknowledgment on every row whoever holds that row's key, since the page renders whatever its link says and a flag the sender set would remove the one pause I-39 imposes.

