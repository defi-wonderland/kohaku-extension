      - judgment: the submitting state and the failed state exist once and every write of the chapter renders them, the failed state carrying its two readings, nothing reached the chain and the account stands as it did, or the call reverted with the cause the receipt carries and its gas gone
      - judgment: the gas step estimates the transaction's own gas through the extension's provider, names the sending key's address, the amount and the network, offers a transfer from another account this wallet holds and a deposit from outside, and says a transfer out of the account that key operates is itself an operation that key must pay for
      - judgment: the step states that the execution after the waiting period is a second funding asked for again at the fee of that day and promises nowhere that one funding covers both, and it renders no faucet link
    body: |
      Write `src/ux/shared/writes/`, the submitting and failed states every write of the chapter shares and the gas check with its deposit step. D-319 states the two readings of the failed state once and every write inherits both. A call the wallet never sent reads that nothing reached the chain and the account stands as it did. A call that reached the chain and reverted reads as a revert, names the cause the receipt carries and says the gas it spent is gone. D-307 adds the reverted cancel's reading, that the attempt is already gone, with the account's controller as it now stands.

      The gas check runs before every call a key the wallet holds sends. It estimates that transaction's own gas through the extension's provider and reads the sending key's balance the same way, since the SDK estimates nothing, D-373. A key that holds too little gets the deposit step rather than a failed transaction. The step names the key as the sending key, shows its address and the estimated amount, names the network the key must be funded on, and offers both routes that fill it, a transfer from another account this wallet holds and a deposit from outside into the address it shows, with the sentence that a transfer out of the account the key operates is itself an operation that key must send and pay for, so a key at zero cannot take the first route alone. The fast track's step says that the account cannot pay for itself until it is recovered and that the execution is a second funding asked for again at execution due at the fee of that day, D-303 and D-393, and no copy promises that one funding covers both. The step offers no faucet link on a test network, D-312, and it is skipped when the key already holds enough.

      The test seat drives the two failed readings from a scripted send error and a scripted receipt, and the gas step from a balance below and above the estimate, on the fast track and on the logged-in route. The implementation seat writes the shared components and no screen that uses them.
