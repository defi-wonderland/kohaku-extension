  - provisional_id: PT-054
    title: The recovery entry and the account step
    size: half-day
    module: ux/recovery/entry
    risk: high
    risk_reason: I-28 is decided here, the one sentence that says no setup was found rendering only on an absent commitment, and a failed read shown as no setup sends a keyless holder away from an account that has recovery.
