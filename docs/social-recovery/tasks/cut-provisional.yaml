      - judgment: the Aadhaar row takes a QR image the holder uploads and runs a test proof against the pinned authority key, is listed last and badged, carries the line that current documents may not verify against the deployed key so this method is discouraged until that is fixed, and says the holder presents the same QR again at recovery
