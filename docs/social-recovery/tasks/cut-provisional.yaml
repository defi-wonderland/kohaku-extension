      - judgment: the save is one confirmation over one batch that writes the kit's authorization where it is not yet written and commits the setup with the opt-out, prepended with the account's deployment from the extension's own account library where the account holds no code, the cost line naming the deployment's gas
      - judgment: after the batch lands the wallet re-derives the commitment it committed before the screen reports success, a disagreement rendering its own failure state after that landed transaction pointing at removing and saving again, and the screen never reports a dead setup as saved
      - judgment: a key that cannot pay gets the shared blocker naming the shortfall and the key's address, the save offers no sponsor, and the six setup records are wiped when the save is reported
    body: |
      Write `src/ux/setup/arm/`, the arming step of D-319. Before the confirmation the screen asks the SDK whether the action fits this account and which key a recovery would remove, through `supportsAccount` and the read D-371 asks the sdk chapter for, scripted in the doubles under cut-q-22, and shows that key as returned. It names the action and its author as the party that will hold the account's authority, from the audited-actions table of PT-038, and offers the kit's audited actions and nothing else. A refusal returns a code and never a sentence, and the wallet writes the string, this release cannot recover this account yet, with its own reason. It refuses a second setup for the same account and action with the words this account already has a recovery setup, edit it instead, naming the rule as the wallet's own since the chain refuses no second setup, I-24, and it refuses a setup on the manager it is configured with while that manager holds one for this account.

      Saving is one confirmation, one batch the account signs to itself through `prepareCommitSetup` over the encrypted path of D-375 and the waiting period, which writes the kit's authorization into the privilege table where it is not yet written and commits the setup with the opt-out the first release commits, contracts D-111. The account's controlling key sends it and pays its gas, so the shared gas check of PT-039 runs first and a key that cannot pay gets the blocker naming the shortfall and the key's address, with no sponsor offered. An account that has never transacted has no code yet, so the extension prepends the deployment from its own account library to the batch, which then deploys the account before it writes the authorization and commits the setup, contracts D-102 and D-105, and the cost line names the deployment's gas, the owner's rulings of 2026-09-09 and 2026-09-18. The batch gets the shared submitting and failed states. After the batch lands the wallet runs `confirmSetup`, the re-derivation of the commitment it committed, before the screen reports success, and a commitment that disagrees gets its own failure state after that landed transaction pointing at removing and saving the setup again, contracts D-103. The screen never reports a dead setup as saved, I-31, and the pairing of the authorization write with the commit is what I-35 rests on. The digest-version check ran when the client was built, PT-038, so no post-save state carries it. On success the six setup records are wiped and the screen routes to the card of PT-048.

      The test seat drives the fit check's refusal, the second-setup refusal, the deployment prepend on a code-less account, the blocker, the landed batch with an agreeing and a disagreeing re-derivation, and the record wipe. The implementation seat writes the step.
