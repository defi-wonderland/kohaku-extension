      Write `src/ux/onboarding/fast-track/`, the fast track of D-303, the ordinary first run shortened into a second keystore entry. Three numbered steps open it, the warning of PT-052, the extension password set here like on any first run since the recoverer may never have installed the extension, and the key created as a new seed entry with its backup ceremony kept in the flow rather than deferred. The key the recovery installs is the one derived from that entry at the account's index plus the extension's offset, contracts D-105, and the step shows that derived address as the key that will control the account, since a key derived any other way leaves the recovered holder with an account this wallet cannot find. The destination key is always one the wallet holds and the step takes no pasted address, I-43 and the owner's ruling of 2026-09-08. The copy at key creation says that the account stays at the same address and that this new key will control it, true on Kohaku's account since a recovery rewrites one privileged key and never the address.

      The sending key is the ordinary key of the seed entry created here and not the derived key the recovery installs, and it sends the request and the execution and pays their gas in the first release. The account step and the readout of PT-054 to PT-056 follow with no step number, and the gas step of PT-039 follows them, after the readout so a recovery the account step refuses costs no gas, D-312, skipped when the key already holds gas. The fresh-install route carries one plain header, the extension's name and the words recover an account, with no settings breadcrumb and no step counter from the account lookup through the done screen, while the logged-in route of PT-054 keeps its breadcrumb and its five-stage counter.

