    body: |
      Write the two identity rows of the checklist of D-392 in `src/ux/recovery/checklist/`, after PT-059. A passport row runs zkPassport's flow on the holder's phone with the same notes and the same hand-off the passkey row of PT-057 has, through the ceremony tab of PT-041 and the method host's create claim, which produces the proof for one place of the request with progress and cancellation, D-372. Every hand-off step states what the phone it reaches reads, the account and the new key, the disclosure the guardian message carries for its own link, so a recoverer who borrows a phone knows what its lender learns. An Aadhaar row takes the same QR the holder presented at enrollment and produces the full proof with progress. A claim that fails comes back as one of the method's typed causes and renders failed with retry, and a ceremony the holder dismisses returns before the method runs as cancelled.

      The test seat drives both rows through a completed claim, a typed failure and a dismissal against the method doubles. The implementation seat writes the two rows inside the checklist.
