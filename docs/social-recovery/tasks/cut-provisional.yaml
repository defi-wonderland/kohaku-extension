    body: |
      Write the two identity rows of D-305 in `src/ux/setup/enroll/`, after PT-046. A passport runs zkPassport's own flow on the holder's phone, a phone able to read the document's chip, through the ceremony tab of PT-041 with progress, abort and a failed state that offers retry, and verifies against the on-chain verifier's pinned key, contracts D-104, so the wallet's verdict and the chain's agree and no test runs against an authority's current key the chain does not hold. The row names the hand-off to the phone and says that renewing the passport ends this credential, since the identifier is derived from the document, D-375, and the four facts that derivation depends on are the sdk chapter's to pin. An Aadhaar identity is a QR image the holder uploads and a test proof against the pinned authority key, with the same states, listed last in the inventory and badged. Its row carries the line the idea draft asks for while the liveness finding stands, that current documents may not verify against the deployed key so this method is discouraged until that is fixed, and says the holder presents the same QR again at recovery.

      Both rows carry the line that this method shows the details on the document and not that the holder is the one using it now, the identity demonstration limit of D-311, and the publication line for the identifier the document produces, since a recovery publishes it beside the account and every later setup with the same document is correlatable to it. Both render the four verdicts of D-372, passed, failed with the cause the test reported, unavailable with retry and not supported with no retry since the answer will not change, and a skipped test reads not tested, never blocking the save, D-312. The identity method's weight line stays off the screens.

      The test seat drives both rows through the four verdicts and the skip against the method doubles and asserts every line. The implementation seat writes the two rows inside the enroll sheet.
