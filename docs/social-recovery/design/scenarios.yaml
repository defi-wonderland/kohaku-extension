# The scenario register is the design's own statement of what happens, in
# order, when somebody uses the kit. An invariant says what must never be
# false; a scenario says what happens step by step, and the two find different
# defects. Each row belongs to exactly one task, which declares it under
# `check: scenarios`, and a row whose walk crosses two or more tasks belongs to
# the integration task of the milestone that receives it.
# Ids are allocated centrally with `mast ids S` and never hand-numbered. A
# retired row keeps its id, so a gap is a record rather than a defect.
# The first eleven rows walk the contracts chapter, D-101 through D-107 and D-111,
# from the account's and the helpers' side. The sdk and ux chapters are walked
# in their own rounds and append their rows here.

- id: S-01
  goal: I want my friends and the passkey on my phone to be able to get me back into this account if I lose my key
  actors: [the account holder, the account, the policy manager, the recovery action, the method modules]
  given: an Ambire account with one privileged key, no setup at the policy manager and no kit slot on the account
  walk:
    - The holder's setup screen asks the recovery action whether it serves this account's implementation (IPolicyAction.supportsAccount).
    - The screen asks the action whether each candidate address holds a key on the account today (IPolicyAction.isAuthority).
    - The screen asks each method the rule names whether it is stopped right now (IPolicyMethodPause.paused, D-111).
    - The holder's client hashes the account, the action, the nonce this write will hold and the setup body into one commitment (D-103 § The setup body).
    - The account runs one batch, writing the action's binding under KIT_SLOT on itself and calling the manager (D-105 § On the demo's account).
    - The manager refuses any nonce but the current one plus one, refuses the commitment of zero-length bytes, stores the commitment and emits its event (IPolicyManager.commitSetup, D-109).
    - The holder's client re-derives the commitment from its own record and reads the authorization back off the account (D-103 § The setup body, IPolicyAction.isAuthorized).
  then: the account holds one setup for one action at nonce one, the account honors that action, no attempt exists, and the chain holds one commitment beside whatever metadata the holder chose to publish.
  even_if: the account's execution function runs the two writes all or nothing, so no half armed state is reachable through this batch. A wallet that sends the two writes as two transactions reaches one of them, and the record says what each costs. A setup with no authorization still admits an attempt that publishes the rule and runs its clock, while an authorization with no setup does nothing until a later commit.
  holds: [I-2, I-10, I-15, I-16, I-20]
  open: []

- id: S-02
  goal: I committed my recovery rule first and I will authorize the recovery contract on my account afterwards
  actors: [the account holder, the account, any submitter, the policy manager, the recovery action]
  given: an account whose holder has committed a setup and has not written the kit slot
  walk:
    - The account calls the manager alone and the manager stores the commitment (IPolicyManager.commitSetup, D-102).
    - The manager never learns whether the account authorizes the action, since no hook reaches it (D-103 § The attempt state machine).
    - Someone holding a satisfying proof set opens an attempt, which publishes the rule and the payload and starts the clock (IPolicyManager.startAttempt, D-102).
    - The wait elapses with the action idle (D-105 § Where it lives and when it runs).
    - Anyone calls the action, which builds the batch and hands it to the account, and the account refuses it because the kit slot holds nothing (IRecoveryAction.executeHandover, D-105 § On the demo's account).
    - The attempt stays waiting, since a failed batch touches no manager state (D-110).
    - The account later writes the kit slot, as a first arming or as a re-authorization.
    - Anyone calls the action again in the next block and the handover lands (D-110).
  then: the handover executes on an attempt whose whole wait ran while the kit could not act, so the notice window the holder committed was spent before anyone could use it.
  even_if: where the holder never authorizes the action, the attempt waits forever. Nothing retires it, since no deadline to consume exists, and it holds the action's one attempt slot until the holder's key, a satisfying proof set or a stopped method's veto ends it.
  holds: [I-6, I-9, I-10, I-18, I-20]
  open: []

- id: S-03
  goal: the people my rule names have approved my new key and I want the clock to start
  actors: [the holder's client, the helpers, any submitter, the policy manager, the method modules]
  given: a setup at a known nonce, no active attempt, and a proof set gathered inside one validity window
  walk:
    - The holder's client builds one request naming the account, the action, the next attempt id, the stored setup nonce, the written-out body, the handover payload, the payment order and one window (AttemptRequest, D-103 § Structs).
    - Each helper signs the approval typed data for their own place under this deployment's own domain (D-103 § The digest).
    - Any funded submitter sends the request, with no authority of their own (IPolicyManager.startAttempt).
    - The manager checks that a setup exists, that no attempt is active, that the nonce is the stored one, that the id is the next one and that the window is open (D-103 § Verification order at acceptance).
    - The manager recomputes the setup commitment from the body in the request and compares it with the stored one (D-103 § Verification order at acceptance).
    - The manager walks the places in strictly increasing order, recomputes each credential hash from the method, the config and the salt, reads each distinct method's stop once, and dispatches each proof as a static call that counts only as an exact magic word (D-103 § Verification order at acceptance, IPolicyMethod.verify).
    - The manager counts the filled places in each clause against that clause's threshold (D-103 § The setup body).
    - The manager writes the attempt with its clock, the payload hash, the order, the distinct methods used and the pause choice, moves the attempt counter and emits the opening event with the body and the payload in the clear (D-109, D-103 § Structs).
  then: one attempt waits under this action, its clock runs from acceptance, and every byte the release will perform is public from that moment.
  even_if: one failing proof reverts the whole call, so a request that falls short writes nothing, starts no clock and leaves no half open attempt to store or to spam. The submitter loses their gas and the account's state is untouched.
  holds: [I-1, I-3, I-4, I-9, I-11, I-13, I-14, I-16, I-20]
  open: []

- id: S-04
  goal: the wait is over and I want my new key on the account and the lost one off it
  actors: [any submitter, the recovery action, the account, the policy manager, the methods the accepted set used]
  given: an attempt waiting past its spendable moment, the action authorized under the kit slot, and the payload the opening event published
  walk:
    - Anyone calls the action with the account and the payload (IRecoveryAction.executeHandover).
    - The action reads the manager's state as an early exit and refuses anything that is not a waiting attempt at or past its wait (D-105 § The spend in one picture).
    - The action builds three calls, or four where the order carries an amount, and hands them to the account's execution function with the blob that account expects (D-105 § On the demo's account).
    - The account bumps its own nonce, checks the kit slot against the action's binding and asks the action whether to run the batch (D-105 § On the demo's account).
    - The action reads the attempt for the calling account, requires the exact call count, rebuilds the handover from the grant and the revoke, compares its hash with the attempt's, and refuses a zero address, a repeated address, a removed entry that is not a key and a new key that already holds anything (IRecoveryAction.validateSig, D-105 § The recovery action).
    - The account runs the batch, with the spend first (D-105 § The spend in one picture).
    - The manager re-checks the attempt, the id, the setup nonce, the wait and the payload hash, asks each used method whether it vetoes unless this setup ignores stops, flips the attempt to consumed and emits its event (IPolicyManager.consume, D-109).
    - The account writes the new key at the grant value, zeroes the removed key, pays the order and checks that the kit slot survived the batch (D-105 § On the demo's account).
  then: the new key holds a key value on the account, the lost key holds none, the approval was released exactly once, and the payment call ran.
  even_if: any call in the batch reverting reverts the spend with it, so the attempt stays waiting and can be executed again once the cause is gone. A repeat of the same batch reverts at the manager, a re-entering payee included, so nothing is spent twice. What the batch does not guarantee is that the payee received anything, since the batch checks only that the call did not revert.
  holds: [I-6, I-17, I-18, I-19, I-20]
  open: []

- id: S-05
  goal: a recovery I never started is running on my account and I still hold my key
  actors: [a watcher, the account holder, the account, the policy manager]
  given: an attempt waiting under the holder's action, and a holder whose key still works
  walk:
    - A watcher reads the opening event off the chain and reaches the holder through a channel the integrator provides (D-103 § Structs, Q-13).
    - The holder's account calls the manager's owner cancel, naming the action and no attempt id (IPolicyManager.cancelByOwner).
    - The manager finds the waiting attempt, flips it to cancelled and emits the cancellation with the account as the canceller, no vetoing method and no places (D-103 § Interface, D-103 § Structs).
    - The attempt counter stays where it is, so the cancelled id is never allocated again (D-103 § Storage).
    - The holder's account commits a new setup, which raises the nonce and retires every proof gathered under the old one (IPolicyManager.commitSetup).
  then: no attempt runs, the rule that admitted the hostile set is replaced, and every approval the attacker banked is dead.
  even_if: where the attempt ended first, the holder's call reverts with nothing to cancel, which is the attempt already gone rather than the holder refused. Where the spend landed first, nothing remains to cancel and the wait was the holder's whole protection. A hook the account installed on itself can revert the account's own path, and the cancel by proofs makes no account call and stays open regardless.
  holds: [I-7, I-10, I-12, I-20]
  open: []

- id: S-06
  goal: we approved a recovery we no longer want, and we want it stopped without waiting for it to land
  actors: [whoever holds the holder's configuration, a satisfying set of credentials, any submitter, the policy manager, the method modules]
  given: an attempt waiting under a setup whose nonce has not moved
  walk:
    - The opening event publishes the body, the places the accepted set filled and the attempt id (D-103 § Structs).
    - Whoever holds the holder's configuration builds one cancellation naming the live attempt id, the stored setup nonce, the body and a window of its own (CancelRequest, D-103 § Structs).
    - Each credential in a satisfying set signs the cancellation typed data for its own place, under a type distinct from the approval's (D-103 § The digest).
    - Anyone sends the cancellation, paying for it themselves (IPolicyManager.cancelByProofs).
    - The manager requires a waiting attempt, the live id, an open window, the stored nonce and an attempt judged under that same nonce, then recomputes the commitment (D-109).
    - The manager verifies every place the way it verifies an opening, reading each distinct method's stop first unless the body ignores stops (D-103 § Verification order at acceptance, D-111).
    - The manager flips the attempt to cancelled and emits the cancellation with the caller, no vetoing method and the places the cancelling set filled (D-109).
  then: the attempt is over, the setup stands untouched at the same nonce, and any further recovery gathers again under the next attempt id and runs the whole wait again.
  even_if: a cancellation that arrives after the spend reverts with nothing to cancel, so a set gathered past the wait is racing whoever executes rather than holding a veto. A cancelling set that leans on a stopped method is refused exactly as an opening set is, so the honest side waits for the lift wherever the setup did not opt out of stops.
  holds: [I-8, I-10, I-11, I-13, I-19, I-20]
  open: []

- id: S-07
  goal: my rule leans on an identity credential and the method that judges it has just been stopped
  actors: [a helper holding an identity document, any submitter, the policy manager, the identity method, its pause holder, anyone]
  given: a setup that did not commit to ignore stops, one of whose clauses an identity credential fills, and a method that is not stopped
  walk:
    - The helper's device produces the proof with the place's digest carried as the stack's own outside signal, which for the Aadhaar method is the keccak of the digest shifted right by three bits (D-104 § The identity methods).
    - The submitter opens the attempt, and the manager reads the method's stop once before any proof of it (D-103 § Verification order at acceptance, D-111).
    - The method checks the proof against its pinned circuit verifier, requires the identity commitment among the public inputs to equal the one the config carries, and returns the magic value (IPolicyMethod.verify, D-104 § The identity methods).
    - The attempt opens and records that method among the distinct methods its accepted set used (Attempt.usedMethods, D-103 § Structs).
    - During the wait the pause holder stops the method, which emits its event and answers the manager's read with true (IPolicyMethodPause.pause, D-111).
    - Anyone calls the veto cancel naming the account, the action, the live attempt id and that method, and the manager checks membership in the used methods, refuses an attempt whose setup ignores stops and requires an exact true (IPolicyManager.cancelByVeto, D-109).
    - The attempt is cancelled and the event names the vetoing method, so the act reads as administrative rather than as helpers backing out (D-103 § Structs).
    - The pause holder later lifts the stop, and every rule naming the method counts again with no write from any holder (IPolicyMethodPause.unpause, D-106).
    - The holder's side gathers a fresh set under the next attempt id and runs the whole wait again (D-103 § The attempt state machine).
  then: the stopped method's proofs counted for nothing while the stop was on, the attempt it opened ended rather than froze, and the lift restored the method without any holder's key.
  even_if: where nobody sends the veto cancel, the attempt keeps waiting and becomes spendable in the first block after the lift, since nothing re-times a waiting attempt and none of the notice window is left. And where the method's key admin sets a key they control instead of stopping the method, no contract check refuses the proofs that key forges.
  holds: [I-4, I-5, I-11, I-14, I-19, I-20]
  open: []

- id: S-08
  goal: a recovery I did not want is running and I would rather replace my rule than only cancel it
  actors: [the account holder, the account, the policy manager]
  given: an attempt waiting under the holder's action, and a holder whose key still works
  walk:
    - The holder's account commits a new setup at the next nonce (IPolicyManager.commitSetup).
    - The manager cancels the active attempt first, with its own event, before the nonce moves (D-103 § The attempt state machine, D-109).
    - The manager raises the nonce by one and stores the new commitment (D-109).
    - Every proof gathered under the old setup now fails before any proof is read, even where the new body rewrites the identical rule (D-103 § The digest, I-12).
    - A spend or a cancellation aimed at the old attempt reverts, since the attempt is gone and its nonce is stale besides (D-103 § The attempt state machine, D-109).
  then: no attempt runs, the rule in force is the new one, and no approval banked under the old one ever counts again.
  even_if: the edit takes effect at once with no wait of its own, so any authority the account already honors replaces the rule immediately while the recovery it forecloses got days. Where the holder clears instead of editing, the clear does the same and leaves the manager nothing to release, while the action's authorization on the account is a separate write the manager never hears about.
  holds: [I-2, I-10, I-12, I-20]
  open: []

- id: S-09
  goal: I hold a complete set of approvals and I want to open the attempt with it
  actors: [the holder's client, any submitter, another satisfying set, the policy manager]
  given: a gathering completed against a setup at one nonce and the attempt id the client predicted
  walk:
    - The client completes a request naming the next attempt id and the stored setup nonce (AttemptRequest, D-103 § Structs).
    - Another satisfying set reaches the chain first and opens that attempt (IPolicyManager.startAttempt, D-103 § The attempt state machine).
    - The submitter sends the first request and the manager reverts, since an attempt is already active (D-109).
    - The holder edits the setup instead, which cancels that attempt and moves the nonce (IPolicyManager.commitSetup).
    - The submitter sends the request again and the manager reverts on the nonce, before it reads any proof (D-103 § The digest, D-109).
    - Had the nonce held, the same request would still fail on the attempt id, since the id it names is spent and the manager rejects any id but the next one (D-103 § The attempt state machine).
  then: nothing was written, no clock started and the submitter paid gas for a refusal.
  even_if: nothing is guaranteed to whoever gathered. Every proof in that request is dead, the whole set gathers again inside a fresh window, and a keyless holder who cannot reassemble their helpers has no other path.
  holds: [I-9, I-10, I-11, I-12]
  open: []

- id: S-10
  goal: the last approval arrived late and I want to submit the set anyway
  actors: [the helpers, the holder's client, any submitter, the policy manager]
  given: a request whose proofs all signed one validity window, and a window that has passed
  walk:
    - Every proof in the request signed the request's own window, so a different window is different bytes (D-103 § The digest, I-13).
    - The slowest helper returns their reply after that moment.
    - The submitter sends the request and the manager compares the block's time against the window before it reads any proof (D-103 § Verification order at acceptance, D-109).
    - The manager reverts as expired, so a stale request fails on the window rather than on a proof (D-109).
    - The same comparison refuses a cancellation past its own window (IPolicyManager.cancelByProofs, D-109).
    - The holder's client opens a fresh gathering with a new window and asks the same people again (D-103 § The digest).
  then: no attempt opened, nothing was written, and the window did the one job it has, bounding how long a gathered set stays submittable.
  even_if: the holder cannot retire that request before its deadline. It stays submittable by anyone holding its bytes until the window ends or another set opens the attempt its id names, and a keyless holder cannot move the nonce against it, so the window's width is that holder's only bound.
  holds: [I-9, I-11, I-13]
  open: []

- id: S-11
  goal: I would rather no security stop ever reach my recoveries, and I accept that it will not stop a forged one either
  actors: [the account holder, the account, the helpers, any submitter, the policy manager, the identity method, its pause holder, anyone]
  given: a holder whose rule names an identity method beside their friends, and a setup screen that has said in the holder's words what the opt-out means
  walk:
    - The holder commits a setup whose body carries ignoresPause set, the one flag for the whole setup (D-103 § The setup body, D-111).
    - The pause holder stops the identity method before any request is sent (IPolicyMethodPause.pause, D-111).
    - The submitter opens an attempt whose set includes the stopped method's proof, and the manager reads the choice from the revealed body, makes no stop read, verifies that proof like any other and accepts (D-103 § Verification order at acceptance, D-111).
    - The manager copies the choice onto the attempt at acceptance, so no caller supplies it later (Attempt.ignoresPause, D-103 § Structs).
    - Anyone calls the veto cancel against the attempt and the manager refuses with AttemptIgnoresPause (IPolicyManager.cancelByVeto, D-103 § Errors).
    - A satisfying set may still cancel by proofs, verified with no stop read, and the holder's own key cancels as always (IPolicyManager.cancelByProofs, IPolicyManager.cancelByOwner, D-111).
    - The wait elapses and the spend makes no veto read and lands (IPolicyManager.consume, D-111).
  then: the stop never touched this holder's attempt at any of the four reads, and the attempt was judged, kept and spent exactly as if no stop existed.
  even_if: a forged proof from the stopped method goes through the same way, since the choice keeps every path open through an incident. What remains is the holder's own cancel and a cancel by proofs, and changing the choice is a fresh setup the holder's key signs, so an attempt already accepted is never re-read under a different choice.
  holds: [I-4, I-7, I-8, I-19, I-20]
  open: []
